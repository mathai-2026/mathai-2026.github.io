# --- General options --- #

url: "https://mathai-2026.github.io"
baseurl: ""

# Name of website
title: 6th MATH-AI Workshop at NeurIPS'26

# Short description of your site
description: "The 6th Workshop on Mathematical Reasoning and AI at NeurIPS 2026"

# Venue line shown under the header of every page that uses the "page" layout
venue: "NeurIPS 2026, Atlanta Hall C3, Saturday, December 12, 2026"

# --- Navigation bar options --- #

# List of links in the navigation bar
navbar-links:
  Call: "cfp"
  Speakers & Panelists: "speakers"
  Organizers: "organizers"
  Papers: "papers"
  Schedule: "schedule"

# Image to show in the navigation bar - image must be a square (width = height)
# avatar: "/img/avatar-icon.png"

# Image logo to show in the top-left corner instead of the title text
# title-img: /path/to/image

# --- Background colour/image options --- #

navbar-col: "#F5F5F5"
navbar-text-col: "#404040"
navbar-children-col: "#F5F5F5"
page-col: "#FFFFFF"
link-col: "#008AFF"
hover-col: "#0085A1"
footer-col: "#F5F5F5"
footer-text-col: "#777777"
footer-link-col: "#404040"

# The navbar, footer, and page background can use images instead of colours
# navbar-img: "/img/mathai2022.png"
# footer-img: "/img/mathai2022.png"
# page-img: "/img/mathai2022.png"

# --- Footer options --- #

author:
  name: Organizers of the 6th MATH-AI Workshop at NeurIPS 2026

# Links shown in the footer; available keys are defined in _data/SocialNetworks.yml
social-network-links:
  email: "mathai.neurips@gmail.com"

# How to display the link to the website in the footer
url-pretty: "mathai-2026.github.io"

# Character used to separate site title and description in the HTML document title
title-separator: "-"

# --- Build options --- #

timezone: "America/New_York"
markdown: kramdown
highlighter: rouge
# The trailing slash also gives pages clean URLs (e.g. /cfp/ instead of /cfp.html)
permalink: /:year-:month-:day-:title/
paginate: 5

kramdown:
  input: GFM

defaults:
  - scope:
      path: "" # all files
    values:
      layout: "page"
      show-avatar: true
  - scope:
      path: "*.md" # top-level workshop pages
    values:
      title: MATH-AI
      subtitle: "The 6th Workshop on Mathematical Reasoning and AI"
      use-site-title: true

# Exclude these files from production site
exclude:
  - openreview
  - scripts
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md

plugins:
  - jekyll-paginate
  - jekyll-sitemap
