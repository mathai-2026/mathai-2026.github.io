<div
  class="col-xs-6 col-sm-4 col-lg-2 col-xl-2 text-center profile-card"
  id="{{ include.p[0] }}"
>
  <div class="profile-photo">
    <img
      src="{{ site.baseurl }}/img/{{ include.p[1].img }}"
      alt="{{ include.p[1].name }}"
    />
  </div>
  <div class="profile-info">
    <a href="{{ include.p[1].url }}">{{ include.p[1].name }}</a>
    <div class="profile-affiliation">{{ include.p[1].affiliation }}</div>
  </div>
</div>
