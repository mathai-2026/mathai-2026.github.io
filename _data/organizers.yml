psong:
  name: "Peiyang Song"
  url: "https://peiyang-song.github.io/"
  affiliation: "CMU"
  img: "psong.jpg"
  bio: "Peiyang Song is a PhD student at Carnegie Mellon University. His research focuses on mathematical reasoning, theorem proving, and natural language reasoning, with an emphasis on integrating formal systems and large language models. He has received various awards, including an IEEE Micro Top Pick Award, a Best Paper Award at the ICML CTB Workshop, and a Best Paper Honorable Mention at the NeurIPS LAW Workshop."
kyang:
  name: "Kaiyu Yang"
  url: "https://yangky11.github.io/"
  affiliation: "Apodex"
  img: "kyang.jpg"
  bio: "Kaiyu Yang is a Chief Scientist at Apodex, working on enhancing AI's capabilities in mathematical reasoning by integrating formal systems such as Lean. His research explores how machine learning and large language models can generate mathematical conjectures, prove theorems, write verifiable code, and perform reasoning that combines natural and formal languages."
plu:
  name: "Pan Lu"
  url: "https://lupantech.github.io/"
  affiliation: "Stanford"
  img: "plu.jpg"
  bio: "Pan Lu is a Postdoctoral Scholar at Stanford University. He received his Ph.D. in Computer Science from UCLA. His research focuses on machine reasoning, particularly in mathematical reasoning and scientific discovery. He has received various awards, including ACL 2023 Best Paper Honorable Mention, KnowledgeNLP Workshop 2025 Best Paper Award, Most Influential NeurIPS Papers, Amazon PhD Fellowship, Bloomberg PhD Fellowship, and Qualcomm Innovation Fellowship."
pshafto:
  name: "Patrick Shafto"
  url: "https://patrickshafto.com/"
  affiliation: "DARPA & Rutgers"
  img: "pshafto.jpg"
  bio: "Patrick Shafto is a Professor of Mathematics and Computer Science at Rutgers University, a Program Manager at DARPA, and the Founder and Scientist-at-Large at Redpoll. His research focuses on the computational principles of human learning, reasoning, communication, and scientific discovery, spanning cognitive science, artificial intelligence, and machine learning."
sarora:
  name: "Sanjeev Arora"
  url: "https://www.cs.princeton.edu/~arora/"
  affiliation: "Princeton"
  img: "sarora.jpg"
  bio: "Sanjeev Arora is a Professor of Computer Science at Princeton University, where he did foundational work in theoretical computer science, complexity theory, and machine learning theory. He has received major honors such as the Gödel Prize, ACM Prize in Computing, and election to the National Academy of Sciences."
kcollins:
  name: "Katie Collins"
  url: "https://collinskatie.github.io/"
  affiliation: "MIT & Princeton & Cambridge"
  img: "kcollins.jpg"
  bio: "Katie Collins is a postdoctoral fellow in the Computational Cognitive Science Group at MIT, a visiting postdoc at the Princeton AI Lab, and a Research Affiliate at the Centre for Human-Inspired AI at the University of Cambridge. Her research focuses on cognitive science, artificial intelligence, human-AI interaction, and mathematical reasoning, including evaluating language models for mathematics through interactions with mathematicians."
swelleck:
  name: "Sean Welleck"
  url: "https://wellecks.com/"
  affiliation: "CMU"
  img: "swelleck.jpg"
  bio: "Sean Welleck is an Assistant Professor in the Language Technologies Institute at Carnegie Mellon University. His research focuses on language modeling, reasoning, controllable generation, and machine learning for formal reasoning, including applications to mathematical reasoning and theorem proving."
mjamnik:
  name: "Mateja Jamnik"
  url: "https://www.cl.cam.ac.uk/~mj201/"
  affiliation: "Cambridge"
  img: "mjamnik.jpg"
  bio: "Mateja Jamnik is a Professor of Artificial Intelligence in the Department of Computer Science and Technology at the University of Cambridge and an associate fellow of the Leverhulme Centre for the Future of Intelligence. Her research focuses on human-like AI, automated reasoning, diagrammatic reasoning, knowledge representation, theorem proving, explainable AI, and cognitive science."
